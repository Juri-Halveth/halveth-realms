name: Grow reviewable world ideas
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: realms-content-proposals
  cancel-in-progress: false
jobs:
  proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm test
      - name: Generate a dated, reproducible world proposal
        run: node scripts/evolve-content.mjs "Scarlet Garden $(date -u +%F)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-ideas-${{ github.run_number }}
          path: .local/proposals/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
