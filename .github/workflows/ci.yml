name: Build and test Realms
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realms-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/verify-vendor.mjs
      - run: npm test
      - run: npm run release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: halveth-realms-source
          path: releases/*
          retention-days: 14
          if-no-files-found: error
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:runtime
      - run: npm test
      - run: node scripts/verify-vendor.mjs
      - run: npm run icons
      - run: npm run desktop:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: halveth-realms-windows-x64-unsigned
          path: releases/desktop/HALVETH-Realms-Setup-*.exe
          retention-days: 14
          if-no-files-found: error
